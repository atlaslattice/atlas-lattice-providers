name: Candidate Contracts — offline regression

# CI verifies source behavior only. It does not authorize actions, attest
# residents/host identity, ratify canon, or establish deployment readiness.
on:
  pull_request:
    paths:
      - 'core/coordinate_resolver.py'
      - 'core/transparent_packet96.py'
      - 'scripts/receipt_completeness.py'
      - 'tests/test_coordinate_resolver.py'
      - 'tests/test_transparent_packet96.py'
      - 'tests/test_receipt_completeness.py'
      - 'tests/test_sentinel_agent.py'
      - 'tests/test_sentinel_receipt_fifo.py'
      - 'core/sentinel_agent.py'
      - '.github/workflows/candidate-contracts.yml'
  push:
    branches:
      - 'ci/candidate-contract-tests-20261122'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-candidate-contracts:
    name: Python ${{ matrix.python-version }} — candidate-only tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run deterministic contract regressions
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python -m compileall -q core/coordinate_resolver.py core/transparent_packet96.py scripts/receipt_completeness.py
          if test -f core/sentinel_agent.py; then
            python -m compileall -q core/sentinel_agent.py
          fi
          python - <<'PY'
          from pathlib import Path
          import sys
          import unittest
          
          required = (
              ('scripts/receipt_completeness.py', 'tests/test_receipt_completeness.py'),
              ('core/coordinate_resolver.py', 'tests/test_coordinate_resolver.py'),
              ('core/transparent_packet96.py', 'tests/test_transparent_packet96.py'),
          )
          for source_path, test_path in required:
              if not Path(source_path).is_file() or not Path(test_path).is_file():
                  sys.exit(f'MISSING_REQUIRED_CONTRACT: {source_path} / {test_path}')
          sentinel_source = Path('core/sentinel_agent.py').is_file()
          sentinel_tests = Path('tests/test_sentinel_agent.py').is_file()
          fifo_tests = Path('tests/test_sentinel_receipt_fifo.py').is_file()
          if sentinel_source != sentinel_tests or (fifo_tests and not sentinel_source):
              sys.exit('INCOMPLETE_SENTINEL_CONTRACT: source/test mismatch')
          test_paths = [test for _, test in required]
          if sentinel_source:
              test_paths.append('tests/test_sentinel_agent.py')
              if fifo_tests:
                  test_paths.append('tests/test_sentinel_receipt_fifo.py')
          for test_path in test_paths:
              suite = unittest.defaultTestLoader.discover('tests', pattern=Path(test_path).name)
              count = suite.countTestCases()
              if count == 0:
                  sys.exit(f'ZERO_TESTS_DISCOVERED: {test_path}')
              print(f'CONTRACT_TESTS_DISCOVERED: {test_path}: {count}', flush=True)
              outcome = unittest.TextTestRunner(verbosity=2).run(suite)
              if not outcome.wasSuccessful():
                  sys.exit(f'CONTRACT_TEST_FAILURE: {test_path}')
          PY
      - name: Record safety boundary
        run: |
          echo 'LOCAL-CODE ONLY: No model calls, secrets, authentication, host integration, CANON, deployment, or resident action is tested here.'
