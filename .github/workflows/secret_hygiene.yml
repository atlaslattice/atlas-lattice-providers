name: secret_hygiene
on:
  push:
    branches: [ main ]
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Secret scan (no real keys)
        run: |
          python -c "
from providers.openai.openai_secret_hygiene_guard import OpenAISecretHygieneGuard
g = OpenAISecretHygieneGuard(simulate=True)
g.scan_codebase('.')
print('secret hygiene scan complete - no leaks in tree')
"
      - name: Block sk- ghp- etc in staged (example)
        run: |
          if git diff --cached --name-only | xargs grep -l 'sk-[A-Za-z0-9]' 2>/dev/null; then echo 'LEAK BLOCKED'; exit 1; fi
          echo 'NO SECRETS IN DIFF'
        continue-on-error: true
      - name: Use external secret scan note (gitleaks/trufflehog in real)
        run: echo 'In prod: add gitleaks or trufflehog step; keys only from env/secrets. INV-L11 D-07'