# CANDIDATE · NOT CANON · AUTHORITY: NONE · DEPLOYMENT: NONE
# Reported findings block the job. Scan coverage still requires independent review.
name: secret_hygiene
on:
  push:
    branches: [ main ]
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Check the hygiene guard report
        run: |
          python - <<'PY'
          import json
          from providers.openai.openai_secret_hygiene_guard import OpenAISecretHygieneGuard
          g = OpenAISecretHygieneGuard(simulate=True)
          result = g.scan_codebase('.')
          report = result.get('report') if type(result) is dict else None
          status = report.get('status') if type(report) is dict else None
          scanned = report.get('scanned_files') if type(report) is dict else None
          hits = report.get('hits') if type(report) is dict else None
          valid = type(scanned) is int and scanned > 0 and type(hits) is list
          known_status = status if status in ('clean', 'SECRETS_DETECTED_BLOCK') else 'UNKNOWN_OR_MALFORMED'
          print(json.dumps({'status': known_status,
                            'scanned_files': scanned if type(scanned) is int else None,
                            'reported_hit_count': len(hits) if type(hits) is list else None,
                            'coverage_attested': False}))
          if not valid or status != 'clean' or hits:
              raise SystemExit(1)
          print('Scanner reported no findings; coverage is not independently attested.')
          PY
      - name: Use external secret scan note (gitleaks/trufflehog in real)
        run: |
          echo 'In prod: add gitleaks or trufflehog step; keys only from env/secrets. INV-L11 D-07'
