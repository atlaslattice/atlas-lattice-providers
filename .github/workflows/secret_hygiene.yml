# CANDIDATE · NOT CANON · AUTHORITY: NONE · DEPLOYMENT: NONE
# Explicit Work-source inputs only. This does not certify the whole repository.
name: secret_hygiene
on:
  push:
    branches: [ main ]
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Check explicitly selected Work-source files
        run: |
          python - <<'PY'
          import importlib.util
          import json

          WORK_SOURCE_PATHS = (
              'providers/openai/openai_secret_hygiene_guard.py',
              '.github/workflows/secret_hygiene.yml',
              'tests/test_secret_hygiene_workflow.py',
              'tests/test_secret_hygiene_files.py',
              'docs/WORK_SOURCE_HYGIENE.md',
          )

          def load_guard():
              # Load only this reviewed source, without provider package initializers.
              spec = importlib.util.spec_from_file_location(
                  '_work_hygiene_guard', 'providers/openai/openai_secret_hygiene_guard.py')
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module.OpenAISecretHygieneGuard

          g = load_guard()(simulate=True)
          result = g.scan_files('.', paths=WORK_SOURCE_PATHS)
          report = result.get('report') if type(result) is dict else None
          status = report.get('status') if type(report) is dict else None
          scanned = report.get('scanned_files') if type(report) is dict else None
          hits = report.get('hits') if type(report) is dict else None
          errors = report.get('errors') if type(report) is dict else None
          requested = report.get('requested_files') if type(report) is dict else None
          complete = report.get('selected_inputs_complete') if type(report) is dict else None
          scope = report.get('scope') if type(report) is dict else None
          valid = (type(scanned) is int and type(requested) is int
                   and scanned == requested == len(WORK_SOURCE_PATHS)
                   and type(hits) is list and type(errors) is list and not errors
                   and complete is True and scope == 'explicit_work_source_files')
          known_status = status if status in ('clean', 'SECRETS_DETECTED_BLOCK', 'SCAN_INCOMPLETE_BLOCK') else 'UNKNOWN_OR_MALFORMED'
          print(json.dumps({'status': known_status,
                            'scanned_files': scanned if type(scanned) is int else None,
                            'requested_files': requested if type(requested) is int else None,
                            'reported_hit_count': len(hits) if type(hits) is list else None,
                            'input_error_count': len(errors) if type(errors) is list else None,
                            'selected_inputs_complete': complete is True,
                            'whole_repository_coverage_attested': False}))
          if not valid or status != 'clean' or hits:
              raise SystemExit(1)
          print('No configured-pattern findings in the explicit Work-source selection.')
          PY
      - name: Use external secret scan note (gitleaks/trufflehog in real)
        run: |
          echo 'In prod: add gitleaks or trufflehog step; keys only from env/secrets. INV-L11 D-07'
