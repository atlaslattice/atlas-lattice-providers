name: Proof receipt synthetic regressions

on:
  pull_request:
  push:
    branches:
      - main
      - one-command-world-class-proof

# This job verifies the local repair only. Whole-proof acceptance remains held.
jobs:
  synthetic-regressions:
    name: Proof receipt synthetic regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .:tests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/world_class_proof.py
            /tests/test_world_class_proof_receipts.py
            /tests/test_world_class_proof_evidence.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run exact offline synthetic test modules
        run: python -B -m unittest -v test_world_class_proof_receipts test_world_class_proof_evidence
