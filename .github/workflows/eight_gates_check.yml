# Status: CANDIDATE CI implementation, NOT CANON.
# AUTHORITY: exact owner project approval contexts only. DEPLOYMENT: no runtime change.
name: Eight Gates Check

on:
  pull_request:
  workflow_dispatch:

jobs:
  eight-gates:
    name: Eight Gates Candidate and Scoped Project Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify scoped approval boundaries
        run: python -m unittest discover -s tests -p "test_eight_gates_project_adoption.py" -v

      - name: Collect changed files
        id: files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            git diff --name-only "origin/${{ github.base_ref }}"...HEAD > changed_files.txt
          else
            git ls-files > changed_files.txt
          fi
          grep -E '\.(py|md|json|ya?ml|txt)$' changed_files.txt > scan_files.txt || true
          cat scan_files.txt

      - name: Run Eight Gates
        shell: bash
        run: |
          if [ ! -s scan_files.txt ]; then
            echo "No candidate text/code files to scan."
            exit 0
          fi
          mapfile -t scan_paths < scan_files.txt
          python core/eight_gates.py "${scan_paths[@]}" \
            --repo-root . \
            --project-approval canon/approval_contexts/ATLAS-UHM-CANON-20261123-001.json \
            --expected-project-approval-sha256 d9bdc343dac6aed89be58fc3cdef4e0d1bb523ff1a6dcfefa5d8da9900084546 \
            --out archive/reports/eight_gates_packet.json

      - name: Upload Eight Gates packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eight-gates-packet
          path: archive/reports/eight_gates_packet.json
          if-no-files-found: ignore

