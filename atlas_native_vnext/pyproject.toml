[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-native-synthesis"
version = "0.1.0"
description = "Source-only, no-execution Atlas evidence/agent interoperability reference"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["native_synthesis*"]

[tool.setuptools.package-data]
native_synthesis = ["catalog.json"]
